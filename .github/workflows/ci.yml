name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # The Playwright suite self-hosts `next start` on :3100 and mocks
      # the aios backend at the proxy boundary, so no live services are
      # needed (see playwright.config.ts).
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm exec playwright test
